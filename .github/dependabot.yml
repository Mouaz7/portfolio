# Weekly update proposals. Patch and minor updates arrive grouped in one pull
# request; major versions come one at a time so they can be reviewed alone.
# Every proposal runs the full CI (including the pixel lock) before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Titles like "chore(deps): …" pass the PR title check.
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
    ignore:
      # Node types follow the runtime in package.json "engines" (22.x).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
